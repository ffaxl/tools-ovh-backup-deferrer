{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "deferrer.secretName" . }}
  labels:
    {{- include "deferrer.labels" . | nindent 4 }}
type: Opaque
stringData:
  OVH_APPLICATION_KEY: {{ required "credentials.applicationKey or credentials.existingSecret is required" .Values.credentials.applicationKey | quote }}
  OVH_APPLICATION_SECRET: {{ required "credentials.applicationSecret is required" .Values.credentials.applicationSecret | quote }}
  OVH_CONSUMER_KEY: {{ required "credentials.consumerKey is required" .Values.credentials.consumerKey | quote }}
{{- end }}
